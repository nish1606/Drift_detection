[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-governance-system"
version = "0.1.0"
description = "Production-grade backend for fraud model governance"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.8",
  "sqlalchemy>=2.0",
  "uvicorn>=0.30",
  "alembic>=1.13",
  "PyYAML>=6.0",
  "numpy>=1.26",
  "scikit-learn>=1.5",
  "httpx>=0.27",
  "pytest>=8.2",
  "joblib>=1.4"
]

[project.optional-dependencies]
ml = ["lightgbm>=4.5", "shap>=0.46", "lime>=0.2.0", "river>=0.21", "evidently>=0.5", "mlflow>=2.16"]
dev = ["black>=24.0", "ruff>=0.6"]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
