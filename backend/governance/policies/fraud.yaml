name: fraud
version: "1.0"
policy_type: threshold
enabled: true
condition: "probability_gte: 0.6"
action: "review or block based on confidence tier"
escalation: "Fraud Ops Lead"
rules:
  - if:
      probability_gte: 0.9
    then:
      action: block
      reason: high model confidence fraud signal
  - if:
      probability_gte: 0.6
    then:
      action: review
      reason: medium confidence fraud signal
