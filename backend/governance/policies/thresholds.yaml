name: thresholds
version: "1.0"
policy_type: threshold
enabled: true
condition: "risk_score_gte: 0.45 or 0.75"
action: "block or review based on risk tier"
escalation: "Risk Engineer"
rules:
  - if:
      risk_score_gte: 0.75
    then:
      action: block
      reason: risk score too high
  - if:
      risk_score_gte: 0.45
    then:
      action: review
      reason: risk score requires review
